name: Sonar Scanner

on:
  push:
    branches: ['main', 'develop', 'prod']



jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: temp_db
        ports:
          - "5432:5432"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Copy application-local.yml
        run: |
          echo "Before copying files"
          ls -al src/main/resources
          mkdir -p src/main/resources
          echo "${{ secrets.MOCK_SUPABASE_YML }}" > src/main/resources/application-local.yml
          echo "After copied files"
          ls -al src/main/resources
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: temp_db
          DB_USERNAME: postgres
          DB_PASSWORD: password
          JWT_SECRET: "mock_jwt_secret_for_code_analysis_only"
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=BokiPassport-Backend -Dsonar.projectName='BokiPassport-Backend'