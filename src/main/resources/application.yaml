spring:
  profiles:
    active:
      - local
  config:
    import: optional:file:.env[.properties]
  application:
    name: bokipassport
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://db:5432/bokipassport
    username: postgres
    password: 123
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000
      refresh-token:
        expiration: 604800000